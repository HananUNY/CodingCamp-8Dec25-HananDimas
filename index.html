<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List - Hanan</title>

    <!-- CSS External File -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <div class="min-h-screen bg-blue-100 py-10 px-4">
        <div class="w-full max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-lg">
            <!-- Header -->
            <header class="mb-8 text-center">
                <h1 class="text-3xl font-bold text-gray-800">My Todo List</h1>
                <p class="text-gray-500 text-sm mt-1">Hanan Dimas Prasetya</p>
            </header>

            <!-- Input Section -->
            <section class="mb-6">
                <form onsubmit="event.preventDefault(); addTodo();" class="flex flex-col md:flex-row gap-3">
                    <div class="flex flex-col flex-1 gap-2">
                        <input type="text" id="todo-input"
                            class="w-full border-2 border-gray-300 rounded-md p-2 focus:border-blue-500 outline-none"
                            placeholder="What needs to be done?">
                    </div>

                    <div class="flex gap-2">
                        <select id="todo-priority"
                            class="border-2 border-gray-300 rounded-md p-2 outline-none cursor-pointer bg-white"
                            title="Select Priority">
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                        <input type="datetime-local" id="todo-date"
                            class="border-2 border-gray-300 rounded-md p-2 outline-none">
                    </div>

                    <button type="submit"
                        class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-6 rounded-md transition duration-200 shadow-md">
                        Add
                    </button>
                </form>
            </section>

            <!-- List Section -->
            <section>
                <div class="flex flex-col gap-4 mb-4">
                    <!-- Filter Buttons -->
                    <div class="flex flex-wrap gap-2 justify-center" id="filter-container">
                        <button onclick="setFilter('all')"
                            class="filter-btn px-3 py-1 rounded-full text-sm font-medium bg-blue-500 text-white shadow-sm transition">All</button>
                        <button onclick="setFilter('high')"
                            class="filter-btn px-3 py-1 rounded-full text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300 transition">High</button>
                        <button onclick="setFilter('medium')"
                            class="filter-btn px-3 py-1 rounded-full text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300 transition">Medium</button>
                        <button onclick="setFilter('low')"
                            class="filter-btn px-3 py-1 rounded-full text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300 transition">Low</button>
                        <button onclick="setFilter('completed')"
                            class="filter-btn px-3 py-1 rounded-full text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300 transition">Done</button>
                    </div>

                    <div class="flex justify-between items-center border-b pb-2">
                        <h2 class="text-xl font-semibold text-gray-700">Tasks</h2>
                        <button id="btn-clear-all" class="text-red-500 hover:text-red-700 text-sm font-semibold">Clear
                            All</button>
                    </div>
                </div>

                <ul id="todo-list" class="space-y-3">
                    <!-- Tasks will appear here -->
                    <li class="text-center text-gray-400 py-4">No tasks yet...</li>
                </ul>
            </section>
        </div>
    </div>

    <!-- Javascript External -->
    <script src="js/script.js"></script>
</body>

</html>
